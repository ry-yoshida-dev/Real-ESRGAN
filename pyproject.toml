[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "real-esrgan"
version = "0.3.0"
description = "Inference-only Real-ESRGAN package for image super-resolution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Xintao Wang", email = "xintao.wang@outlook.com" },
]
keywords = ["super-resolution", "image-restoration", "pytorch", "real-esrgan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "basicsr>=1.4.2",
    "numpy",
    "opencv-python",
    "torch>=1.7",
    "torchvision",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/xinntao/Real-ESRGAN"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
real_esrgan = ["py.typed"]
